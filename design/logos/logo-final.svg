      <stop offset="0" stop-color="#B558F6"/>
      <stop offset="1" stop-color="#5B2BE0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
