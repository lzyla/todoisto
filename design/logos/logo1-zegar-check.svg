<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Koncept 1: „Zegar-check" — wskazówki zegara układają się w znak ukończenia -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="0.55" stop-color="#6E45D9"/>
      <stop offset="1" stop-color="#2563C9"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg1)"/>
  <!-- pierścień tarczy -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="24"/>
  <!-- znaczniki godzin 12 / 3 / 6 / 9 -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <rect x="248" y="122" width="16" height="30" rx="8"/>
    <rect x="360" y="248" width="30" height="16" rx="8"/>
    <rect x="248" y="360" width="16" height="30" rx="8"/>
    <rect x="122" y="248" width="30" height="16" rx="8"/>
  </g>
  <!-- wskazówki jako check -->
  <polyline points="186,258 240,314 342,196" fill="none" stroke="#FFFFFF"
            stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
