<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Koncept 2: „Klepsydra" — czas przesypuje się w zrobione (dolna komora = check) -->
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F1FE"/>
      <stop offset="1" stop-color="#EAF0FE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg2)"/>
  <!-- korpus klepsydry (symetryczny, zwężenie w środku) -->
  <path d="M170 122 H342 V152 Q342 224 256 256 Q342 288 342 360 V390 H170 V360 Q170 288 256 256 Q170 224 170 152 Z"
        fill="none" stroke="url(#g2)" stroke-width="28" stroke-linejoin="round"/>
  <!-- belki górna i dolna -->
  <rect x="128" y="92" width="256" height="30" rx="15" fill="url(#g2)"/>
  <rect x="128" y="390" width="256" height="30" rx="15" fill="url(#g2)"/>
  <!-- piasek: strużka + check w dolnej komorze -->
  <circle cx="256" cy="252" r="9" fill="url(#g2)"/>
  <circle cx="256" cy="286" r="7" fill="url(#g2)" opacity="0.75"/>
  <polyline points="222,344 250,370 296,314" fill="none" stroke="url(#g2)"
            stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
